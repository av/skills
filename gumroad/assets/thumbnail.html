<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 720px;
    background: #111;
    font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .grid-bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .content {
    position: relative;
    z-index: 1;
    text-align: center;
  }
  .icons {
    display: flex;
    gap: 24px;
    margin-bottom: 48px;
    justify-content: center;
  }
  .icon {
    width: 64px;
    height: 64px;
    border: 2px solid #0066FF;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    background: rgba(0,102,255,0.08);
  }
  .title {
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -2px;
    margin-bottom: 16px;
  }
  .title span { color: #0066FF; }
  .subtitle {
    font-size: 28px;
    color: rgba(255,255,255,0.5);
    font-weight: 400;
    margin-bottom: 32px;
  }
  .price {
    display: inline-flex;
    gap: 24px;
    font-size: 20px;
    color: rgba(255,255,255,0.7);
  }
  .price .each { color: #0066FF; }
  .price .bundle { color: #fff; font-weight: 700; }
  .author {
    position: absolute;
    bottom: 32px;
    font-size: 16px;
    color: rgba(255,255,255,0.3);
  }
  .glow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,102,255,0.15) 0%, transparent 70%);
    top: -200px;
    right: -100px;
    z-index: 0;
  }
  .glow2 {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,102,255,0.1) 0%, transparent 70%);
    bottom: -100px;
    left: -50px;
    z-index: 0;
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="content">
    <div class="icons">
      <div class="icon">🐛</div>
      <div class="icon">🧪</div>
      <div class="icon">💡</div>
      <div class="icon">⏱️</div>
      <div class="icon">🏗️</div>
      <div class="icon">⚛️</div>
      <div class="icon">🗄️</div>
      <div class="icon">🧮</div>
      <div class="icon">🔧</div>
      <div class="icon">📦</div>
    </div>
    <div class="title"><span>10</span> SKILLS</div>
    <div class="subtitle">for AI Coding Agents</div>
    <div class="price">
      <span class="each">$3 each</span>
      <span>·</span>
      <span class="bundle">$10 bundle — save $20</span>
    </div>
  </div>
  <div class="author">@av · github.com/av/skills</div>
</body>
</html>
